<g transform="translate(270 0)" stroke="#7FD4FF" stroke-width="12" stroke-linecap="round"><line x1="0" y1="-70" x2="0" y2="70"/><line x1="-60" y1="-35" x2="60" y2="35"/><line x1="-60" y1="35" x2="60" y2="-35"/></g>
<rect x="60" y="230" width="210" height="56" rx="28" fill="#7FD4FF"/><text x="165" y="268" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="28" fill="#0B2A6B">FROZEN</text></g><line x1="650" y1="400" x2="784" y2="400" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/><path d="M810 400 L780 382 L780 418 Z" fill="#FFFFFF"/><g transform="translate(830 300)"><rect width="300" height="200" rx="26" fill="#0B7F5A"/><rect x="190" y="70" width="110" height="60" rx="14" fill="#3DBE8B"/><circle cx="222" cy="100" r="12" fill="#fff"/>
